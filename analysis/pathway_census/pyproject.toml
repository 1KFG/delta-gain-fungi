[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathway_census"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pathway_census"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
