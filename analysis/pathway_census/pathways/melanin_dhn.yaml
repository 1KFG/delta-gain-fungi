    reactions:
      - "CUR:melanin_dhn:t4hn_synthesis"
    lineage_note: "Three PKS routes give 1,3,6,8-tetrahydroxynaphthalene (T4HN): a true THN synthase (this route needs no Ayg1), a hexaketide PKS plus Yg1, and a heptaketide PKS plus Ayg1. All are non-reducing iterative type I PKS; the product chain length cannot be read from a domain hit, so the call needs tree placement with the references and decoys of all three PKS steps. The same gene name PKS1 is used for two enzymes: PKS1 of Colletotrichum lagenarium is a THN synthase, PKS1 (WdPKS1) of Exophiala (Wangiella) dermatitidis is the hexaketide synthase. A gene name is valid only with its organism. The UniProt organism name of P79068 is Glomerella lagenarium (UniProt taxid 5462); the other Colletotrichum references are Colletotrichum orbiculare (NCBI taxid 5465). The two names are not merged. Lineage restrictions: Aspergillus terreus lacks the genes for DHN-melanin and makes Asp-melanin (MelA, TyrP; PMID 27133313), so absence there is not a defect. Botrytis cinerea and other Leotiomycetes carry two melanin PKS (bcpks12 for sclerotia, bcpks13 for conidia; PMID 26514268); BcYGH1 converts the BcPKS13 product."

