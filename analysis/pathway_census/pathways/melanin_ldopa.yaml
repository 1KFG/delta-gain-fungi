    lineage_note: "Tyrosinase of the Asp-melanin cluster. UniProt Q0CRX0 gives it EC 1.14.18.- (not EC 1.14.18.1) and two reactions with aspulvinone E (RHEA:74195, RHEA:74199). The abstract of PMID 27133313 states that TyrP activates aspulvinone E for polymerisation and states no assay, so the links are held at T3. The products have charged ChEBI entries only, so the route gives no product in the tables. TyrP is a short tyrosinase-like protein (356 residues): 45% identical to ivoB, 36% to orsC and 35% to the catechol oxidase AoCO4 (decoys), and 13 to 17% to the references of step tyrosinase (MEASURED 2026-11-21). Whether TyrP oxidises L-tyrosine or L-DOPA is not stated in the records that were read. Gene names: UniProt gives tyrP the synonym melB; melB of Aspergillus oryzae is another, long tyrosinase (step tyrosinase). A gene name is valid only with its organism. Described for Aspergillus terreus only; absence elsewhere is not a defect."
