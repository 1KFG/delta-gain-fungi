# L-DOPA melanin and other melanin routes, step set v2 (stage 1, task S5, 2026-11-21).
#
# Status: DRAFT for user review. Pathway-level verified: false.
# Do not run a census against this file until the user has reviewed the step list.
#
# Reference checks: refs/melanin_ldopa/provenance.tsv, refs/melanin_ldopa/decoys/provenance.tsv and
# refs/melanin_ldopa/UNVERIFIED.md. Evidence tiers, quotes and reactions: kb/melanin_ldopa/*.tsv.
#
# A ref has verified: true only when, on 2026-11-21, (1) the UniProt entry was fetched and its
# organism and gene name matched, (2) the UniProt entry carries the EC and Rhea reaction of the
# step, and (3) the PMID exists in PubMed and is cited by the entry. It never means a person
# reviewed it. Q2TL94 is verified: false because UniProt gives the entry no gene name.
# A decoy has verified: true when the UniProt entry was fetched on 2026-11-21, its organism and
# gene name matched, it carries the family ids of the step, and it carries neither the EC nor a
# Rhea reaction of the step. The decoys are reviewed entries, except Q2UNF9 (AoCO4), whose
# function is in two abstracts. A decoy pmid is given only when the abstract was read.
#
# Field notes:
# - Routes: five routes. They are alternatives; no route joins two of them. Tyrosinase and
#   laccase are separate steps in separate routes. A laccase is never linked to tyrosine
#   hydroxylation.
# - exogenous_substrate: the schema has no field for it. Each route note starts with
#   "exogenous_substrate: true" or "exogenous_substrate: false". Only laccase_exogenous is true:
#   Cryptococcus neoformans makes melanin only from exogenous substrates (PMID 17098915). The
#   lineage_note of step laccase_diphenol carries the same text. Tests check both.
# - Dopaquinone to dopachrome and onward is non-enzymatic in the tables. The T4 step
#   dopachrome_onward is in kb/melanin_ldopa/step.tsv only (it has no reference protein).
# - species: the organism name of the UniProt entry, copied exactly. UniProt names serotype D
#   Cryptococcus neoformans "Cryptococcus deneoformans", Pholiota nameko "Pholiota microspora"
#   and Pycnoporus sanguineus "Trametes sanguinea".
# - gene_name: a gene name of the UniProt entry (an ORF name where the entry has no other
#   name). It is valid only together with species.
# - pmid of a ref: a paper cited by the UniProt entry. The papers that show each reaction are
#   in step_reaction.tsv; some of them are not cited by the entry (UNVERIFIED.md, section A).
# - domains_any: Pfam / NCBIfam ids from the UniProt cross-references of the references. The
#   families are broader than the steps. A step call needs HMM plus tree placement with decoys.
# - reactions: ids of kb/melanin_ldopa/reaction.tsv. The tier of each (protein, reaction) link
#   is in kb/melanin_ldopa/step_reaction.tsv, not here.
# - copy_expect, optional and role are PROPOSED values. No census data exists yet. Every step
#   is optional: the routes are alternatives, and absence of one is not a defect.
# - KEGG: K00505, K00421, K05909, K00457 and K00451 are cross-references in
#   kb/melanin_ldopa/step.tsv only (names read from KEGG list on 2026-11-21).
id: melanin_ldopa
verified: false
routes:
  - id: tyrosinase_dopa
    name: "tyrosinase route to L-dopaquinone (Neurospora crassa T, Aspergillus oryzae melB, Agaricus bisporus PPO4)"
    step_ids: [tyrosinase]
    note: "exogenous_substrate: false. One step. Tyrosinase makes L-dopaquinone from L-tyrosine (RHEA:18117) or from L-DOPA (RHEA:34287). From L-dopaquinone onward (L-dopachrome, 5,6-dihydroxyindole-2-carboxylic acid, the polymer) the table is non-enzymatic; a fungal enzyme there is T4 (step dopachrome_onward, in kb/melanin_ldopa/step.tsv only). The polymer is not a compound of the table."
  - id: laccase_exogenous
    name: "laccase route from exogenous diphenols (Cryptococcus neoformans and Cryptococcus deneoformans LAC1, LAC2)"
    step_ids: [laccase_diphenol]
    note: "exogenous_substrate: true. One step, and its substrate comes from outside the fungus: Cryptococcus neoformans produces melanin only from exogenous substrates and needs diphenolic precursors (PMID 17098915). The laccase oxidises the diphenol that is supplied: L-DOPA to L-dopaquinone, dopamine to decarboxy dopachrome (PMID 8300520), homogentisic acid to a pigment (PMID 17098915). There is no tyrosine hydroxylation. A capability call for this route needs the substrate in the environment; gene presence alone shows nothing about the pigment."
  - id: pyomelanin
    name: "pyomelanin route through homogentisic acid (Aspergillus fumigatus hppD)"
    step_ids: [hppd]
    note: "exogenous_substrate: false. One enzyme step: HppD makes homogentisic acid. The pigment forms by oxidation of homogentisic acid with no enzyme link in the table (curated reaction hga_autooxidation). HmgA is not in this route: it removes homogentisic acid (route tyrosine_degradation). Reference organism: Aspergillus fumigatus (PMID 19028908)."
  - id: tyrosine_degradation
    name: "removal of homogentisic acid, competing with pyomelanin (Aspergillus fumigatus hppD, hmgA)"
    step_ids: [hppd, hmga]
    note: "exogenous_substrate: false. This is not a pigment route. HppD then HmgA: homogentisic acid is removed as 4-maleylacetoacetic acid. It competes with route pyomelanin; the hmgA deletion of Aspergillus fumigatus raises pigment formation (PMID 19028908). The route is declared so that hmgA counts against pyomelanin and not for it."
  - id: asp_melanin
    name: "Asp-melanin route (Aspergillus terreus melA, tyrP)"
    step_ids: [aspulvinone_e_synthase, asp_melanin_tyrosinase]
    note: "exogenous_substrate: false. MelA makes aspulvinone E; TyrP activates it for polymerisation (Aspergillus terreus, PMID 27133313). The TyrP products have charged ChEBI entries only (CHEBI:193114, CHEBI:193115), so the tables give no product for this route; the first step alone gives aspulvinone E."
steps:
  - id: tyrosinase
    name: "tyrosinase (L-tyrosine and L-DOPA to L-dopaquinone)"
    ec: "1.14.18.1"
    route: tyrosinase_dopa
    refs:
      # pmid 2529259 is the gene paper cited by the entry (no assay in the abstract). The T1c link rests on
      # PMID 2147580 (same first and last author), which the entry does not cite.
      - accession: P00440
        species: "Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)"
        gene_name: "T"
        pmid: "2529259"
        verified: true
      # melB of Aspergillus oryzae (PMID 16233650, 22213164, 23053534). The UniProt entry has the ORF name
      # OAory_01107480 only; the name melB is not in the entry. The tie is the sequence: PDB 3W6W (title: melB
      # holo-protyrosinase) has this sequence at 615 of 616 residues, and the entry has the 616 residues that
      # PMID 16233650 gives for melB. Q2UP46 (RIB40 gene model of the locus, 638 residues, 91% identical) is not
      # the assayed sequence and is not a reference. Links held at T3. See UNVERIFIED.md, A2.
      - accession: A0A1S9DK56
        species: "Aspergillus oryzae"
        gene_name: "OAory_01107480"
        pmid: "32356371"
        verified: true
      # melO of PMID 7893753 (539 residues in the abstract and in the entry). Links held at T3.
      - accession: Q00234
        species: "Aspergillus oryzae (strain ATCC 42149 / RIB 40)"
        gene_name: "melO"
        pmid: "7893753"
        verified: true
      # PPO4 ('Tyrosinase 4' in UniProt) = tyrosinase 4 / AbPPO4 of PMID 28500345, which the entry does not cite. Links held at T3.
      # pmid 20676921 is the cDNA paper cited by the entry (the Escherichia coli product there had no activity).
      - accession: C7FF05
        species: "Agaricus bisporus"
        gene_name: "PPO4"
        pmid: "20676921"
        verified: true
      # PPO3: the H subunit of the crystallised tyrosinase complex (PMID 21598903). Links held at T3.
      - accession: C7FF04
        species: "Agaricus bisporus"
        gene_name: "PPO3"
        pmid: "21598903"
        verified: true
      # UniProt organism: Pholiota microspora. The paper says Pholiota nameko (one NCBI taxid, 1538424). Links held at T3.
      - accession: A7BHQ9
        species: "Pholiota microspora"
        gene_name: "tyr1"
        pmid: "17617709"
        verified: true
      # verified: false, for one reason only: the UniProt entry has NO gene name, so the gene-name rule cannot
      # be met. gene_name below is the protein name of the entry; it is not a UniProt gene name. The entry
      # cites PMID 16151802. UniProt organism: Trametes sanguinea (taxid 158606); the paper says Pycnoporus
      # sanguineus, a name with no NCBI taxid hit. The user decides at the review gate (UNVERIFIED.md).
      - accession: Q2TL94
        species: "Trametes sanguinea"
        gene_name: "tyrosinase"
        pmid: "16151802"
        verified: false
    decoys:
      - accession: Q5BGU9
        species: "Aspergillus nidulans (strain FGSC A4 / ATCC 38163 / CBS 112.46 / NRRL 194 / M139)"
        gene_name: "ivoB"
        pmid: "2126551"
        verified: true
      - accession: Q5AUW8
        species: "Aspergillus nidulans (strain FGSC A4 / ATCC 38163 / CBS 112.46 / NRRL 194 / M139)"
        gene_name: "orsC"
        pmid: null
        verified: true
      - accession: A0A8J9R8H5
        species: "Diaporthe leptostromiformis"
        gene_name: "phomQ1"
        pmid: null
        verified: true
      - accession: Q2UNF9
        species: "Aspergillus oryzae (strain ATCC 42149 / RIB 40)"
        gene_name: "AO090001000383"
        pmid: "24043469"
        verified: true
      - accession: B1VTI5
        species: "Streptomyces griseus subsp. griseus (strain JCM 4626 / CBS 651.72 / NBRC 13350 / KCC S-0626 / ISP 5235)"
        gene_name: "griF"
        pmid: "16282322"
        verified: true
    domains_any: [PF00264]
    copy_expect: multi
    role: catalytic
    fused_with: []
    optional: true
    reactions:
      - "RHEA:18117"
      - "RHEA:34287"
    lineage_note: "Tyrosinase and laccase both oxidise L-DOPA to the quinone, and they are not related in sequence. The annotation that separates them: a tyrosinase is EC 1.14.18.1 with RHEA:18117 (L-tyrosine to L-dopaquinone) and RHEA:34287 (L-DOPA to L-dopaquinone), in the type-3 copper family (Pfam PF00264); a laccase is EC 1.10.3.2 with the generic reaction RHEA:11276 only, in the multicopper oxidase family (Pfam PF07732, PF00394, PF07731). A laccase does not hydroxylate tyrosine: UniProt states for LAC1 of Cryptococcus (Q55P57, from PMID 8300520) that it does not oxidise monophenols such as tyrosine. A PF00264 hit is not a tyrosinase call. MEASURED on 2026-11-21 (global alignment): the references are 20 to 55% identical to each other; the decoys (the short tyrosinase-like proteins ivoB, orsC and phomQ1, the catechol oxidase AoCO4, the bacterial GriF) and TyrP of Asp-melanin are 12 to 18% identical to the references and 20 to 45% to each other. UniProt gives EC 1.14.18.1 also to tyrosinases of other pathways, for example ustQ of ustiloxin biosynthesis (B8NM74); such entries are neither decoys nor references. Rhea writes L-tyrosine to L-dopaquinone as one reaction, so free L-DOPA is not a product of the table. From L-dopaquinone onward (L-dopachrome and later) the table is non-enzymatic; any fungal enzyme there is T4. No tyrosinase link is above T1c: no abstract that was read names the protein and L-tyrosine or L-DOPA in one sentence (assays of substrate classes are held at T3). Gene names: T (Neurospora crassa), melO and melB (Aspergillus oryzae; UniProt A0A1S9DK56 has the ORF name OAory_01107480 only), PPO3 and PPO4 (Agaricus bisporus), tyr1 (Pholiota microspora). melB is also a UniProt synonym of tyrP of Aspergillus terreus (Q0CRX0, Asp-melanin). A gene name is valid only with its organism."

