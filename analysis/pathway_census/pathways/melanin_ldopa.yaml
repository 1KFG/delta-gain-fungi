        gene_name: "abr1"
        pmid: null
        verified: true
    domains_any: [PF07732, PF00394, PF07731]
    copy_expect: multi
    role: catalytic
    fused_with: []
    optional: true
    reactions:
      - "CUR:melanin_ldopa:ldopa_oxidation_laccase"
      - "CUR:melanin_ldopa:dopamine_oxidation_laccase"
      - "CUR:melanin_ldopa:hga_oxidation_laccase"
    lineage_note: "Tyrosinase and laccase both oxidise L-DOPA to the quinone, and they are not related in sequence. The annotation that separates them: a tyrosinase is EC 1.14.18.1 with RHEA:18117 (L-tyrosine to L-dopaquinone) and RHEA:34287 (L-DOPA to L-dopaquinone), in the type-3 copper family (Pfam PF00264); a laccase is EC 1.10.3.2 with the generic reaction RHEA:11276 only, in the multicopper oxidase family (Pfam PF07732, PF00394, PF07731). A laccase does not hydroxylate tyrosine: UniProt states for LAC1 of Cryptococcus (Q55P57, from PMID 8300520) that it does not oxidise monophenols such as tyrosine. exogenous_substrate: true. Cryptococcus neoformans produces melanin only from exogenous substrates and needs diphenolic precursors (PMID 17098915), so the substrate of this step comes from outside and the fungus is not shown to make L-DOPA. The compound that enters the table depends on the substrate supplied: L-DOPA, dopamine (oxidised to decarboxy dopachrome, PMID 8300520) or homogentisic acid (PMID 17098915). The step is not specific to melanin: every laccase (EC 1.10.3.2) has the same generic reaction, so laccases with other roles (lignin laccases, yA of Aspergillus nidulans) are not decoys, and a laccase hit does not show melanin formation. The decoys are multicopper oxidases with another annotated reaction (22 to 29% identical to the references, MEASURED 2026-11-21). LAC1 and LAC2 of Cryptococcus neoformans H99 are 72% identical; LAC1 of serotype D (Cryptococcus deneoformans) and LAC1 of serotype A are 90% identical. Gene names: LAC1 names the diphenol laccase in Cryptococcus and a DHN-melanin cluster oxidase in Verticillium dahliae (G2WRK6). A gene name is valid only with its organism."

