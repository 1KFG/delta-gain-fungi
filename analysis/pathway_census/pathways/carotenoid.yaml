# Carotenoid pathway definition (Task 3 draft, 2026-11-20).
#
# Status: DRAFT for user review (spec section 5.8). Pathway-level verified: false.
# Do not run a census against this file until the user has reviewed the step list.
#
# Reference checks: see refs/carotenoid/provenance.tsv and
# .superpowers/sdd/2026-11-20-pathway-census-carotenoid-pilot/task-3-report.md.
# A ref has verified: true only when (1) the UniProt entry was fetched on
# 2026-11-20 and its gene name, organism and length matched, (2) the UniProt
# entry cites the PMID, and (3) the PubMed record (title/abstract) describes the
# function of that gene for this step.
#
# Field notes:
# - domains: Pfam / NCBIfam IDs taken from the UniProt cross-references of the
#   reference proteins (MEASURED from UniProt, not from an hmmscan run here).
#   These families are broader than the step. A step call needs HMM plus tree
#   placement (spec anti-goals). Do not count bare Pfam hits as steps.
# - copy_expect, optional and role are PROPOSED values. No census data exists yet.
# - Fused genes: phytoene synthase and lycopene cyclase are one protein in the
#   reference fungi (al-2, carRA, carRP, crtYB). The same accessions are refs of
#   both steps. Place the two domains on separate trees (Fable review item 7).
id: carotenoid
verified: false
steps:
  - id: ggpp_synthase
    name: geranylgeranyl diphosphate synthase (al-3, carG, crtE)
    ec: "2.5.1.29"
    # PROPOSED multi: PF00348 is also used for prenylation and terpenoid
    # clusters (Fable review item 5). The carotenoid-specific clade is not defined.
    refs:
      - accession: P24322
        species: Neurospora crassa
        pmid: "1826006"
        verified: true
      - accession: Q9P885
        species: Mucor circinelloides f. lusitanicus
        pmid: "12695851"
        verified: true
    domains: [PF00348]
    copy_expect: multi
    role: catalytic
    fused_with: []
    optional: false

  - id: phytoene_synthase
    name: phytoene synthase (C-terminal domain of al-2 / carRA / carRP / crtYB)
    ec: "2.5.1.32"
    # PF00494 (SQS_PSY) also contains squalene synthase (ERG9), present in
    # nearly all fungi. The phytoene synthase clade must be separated by tree.
    refs:
      - accession: P37295
        species: Neurospora crassa
        pmid: "8163509"
        verified: true
      - accession: Q8X0Z1
        species: Fusarium fujikuroi
        pmid: "12172798"
        verified: true
      - accession: Q9P854
        species: Phycomyces blakesleeanus
        pmid: "11172012"
        verified: true
      - accession: Q9UUQ6
        species: Mucor circinelloides f. lusitanicus
        pmid: "10951210"
        verified: true
      - accession: Q7Z859
        species: Xanthophyllomyces dendrorhous
        pmid: "10589832"
        verified: true
    domains: [PF00494]
    copy_expect: single
    role: catalytic
    fused_with: [lycopene_cyclase]
    optional: false

  - id: lycopene_cyclase
    name: lycopene beta-cyclase (N-terminal CarR domain of al-2 / carRA / carRP / crtYB)
    ec: "5.5.1.19"
    # TIGR03462 (NCBIfam CarR_dom_SF, InterPro IPR017825) is on all five refs in
    # UniProt. Pfam PF18916 (Lycopene_cyc) is cross-referenced only on P37295.
    # Whether PF18916 detects the other fungal cyclase domains is UNVERIFIED
    # (Fable review item 5). Prefer TIGR03462 for the prefilter.
    # A standalone bacterial-type crtY hit in a fungal assembly is a
    # contamination suspect (Fable review items 6 and 8).
    refs:
      - accession: P37295
        species: Neurospora crassa
        pmid: "11862485"
        verified: true
      - accession: Q8X0Z1
        species: Fusarium fujikuroi
        pmid: "12172798"
        verified: true
      - accession: Q9P854
        species: Phycomyces blakesleeanus
        pmid: "11172012"
        verified: true
      - accession: Q9UUQ6
        species: Mucor circinelloides f. lusitanicus
        pmid: "10951210"
        verified: true
      - accession: Q7Z859
        species: Xanthophyllomyces dendrorhous
        pmid: "10589832"
        verified: true
    domains: [TIGR03462, PF18916]
    copy_expect: single
    role: catalytic
    fused_with: [phytoene_synthase]
    optional: false

  - id: phytoene_desaturase
    name: phytoene desaturase (al-1, carB, crtI)
    # EC from UniProt P54982. P21334 and Q8X0Z0 carry EC 1.3.99.- in UniProt.
    ec: "1.3.99.30"
    # PF01593 (Amino_oxidase) is a very broad family. Tree placement required.
    refs:
      - accession: P21334
        species: Neurospora crassa
        pmid: "11017770"
        verified: true
      - accession: Q8X0Z0
        species: Fusarium fujikuroi
        pmid: "12172798"
        verified: true
      - accession: P54982
        species: Phycomyces blakesleeanus
        pmid: "9079885"
        verified: true
      - accession: O13506
        species: Xanthophyllomyces dendrorhous
        pmid: "10397832"
        verified: true
    domains: [PF01593]
    copy_expect: single
    role: catalytic
    fused_with: []
    optional: false

  - id: carx
    name: beta-carotene cleaving oxygenase, retinal-forming (CarX)
    ec: "1.13.11.63"
    # Not required for neurosporaxanthin synthesis (PMID 17293483). Off the
    # main route; PROPOSED optional.
    refs:
      - accession: S0ENQ2
        species: Fusarium fujikuroi IMI 58289
        pmid: "17293483"
        verified: true
    domains: [PF03055]
    copy_expect: single
    role: catalytic
    fused_with: []
    optional: true

  - id: cart
    name: torulene cleaving oxygenase (CarT; cao-2 in Neurospora)
    ec: "1.13.11.59"
    # cao-2 is kept as a ref of this step, not as a separate step: PMID 17610084
    # shows CAO-2 cleaves torulene to beta-apo-4'-carotenal, the CarT reaction.
    # Same RPE65 family as carx; carx and cart need separate reference clades.
    refs:
      - accession: A1KQY3
        species: Fusarium fujikuroi
        pmid: "17493127"
        verified: true
      - accession: A7UXI1
        species: Neurospora crassa
        pmid: "17610084"
        verified: true
    domains: [PF03055]
    copy_expect: single
    role: catalytic
    fused_with: []
    optional: true

  - id: ylo1
    name: beta-apo-4'-carotenal dehydrogenase (ylo-1, carD)
    ec: "1.2.1.82"
    # Last step of neurosporaxanthin synthesis. PF00171 (Aldedh) is very broad.
    refs:
      - accession: Q1K615
        species: Neurospora crassa
        pmid: "18627463"
        verified: true
      - accession: F6IBC7
        species: Fusarium fujikuroi IMI 58289
        pmid: "21749649"
        verified: true
    domains: [PF00171]
    copy_expect: single
    role: catalytic
    fused_with: []
    optional: true

  - id: astaxanthin_synthase
    name: astaxanthin synthase, cytochrome P450 (crtS / asy)
    ec: null
    # Needs the P450 reductase crtR as electron donor (PMID 18837978). crtR is a
    # general CPR and is not listed as a step (weak marker; Fable review item 6).
    # PF00067 (p450) is one of the largest fungal families. Tree placement required.
    refs:
      - accession: B5LEC8
        species: Xanthophyllomyces dendrorhous
        pmid: "18769767"
        verified: true
      # Functional characterisation paper. PubMed checked. No protein accession
      # is linked to this PMID in UniProt or NCBI elink, so it stays unverified.
      - accession: null
        species: Xanthophyllomyces dendrorhous
        pmid: "16416328"
        verified: false
    domains: [PF00067]
    copy_expect: single
    role: catalytic
    fused_with: []
    optional: true
