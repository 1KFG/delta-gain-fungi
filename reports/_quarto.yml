# Quarto project config: renders reports/*.qmd into docs/reports/ (kept
# separate from the hand-written Jekyll landing page at docs/index.md — see
# docs/_config.yml's header comment for why the two coexist without conflict).
#
# Render locally with:
#   module load quarto
#   cd reports && quarto render
#
# Reads pipeline outputs directly from ../results/ and ../lib/ at render
# time (those stay on /bigdata, gitignored) and emits only the small,
# publishable HTML/figures/tables into docs/reports/ (git-tracked).

project:
  type: website
  output-dir: ../docs/reports

website:
  title: "DeltaGain Reports"
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: delta_gain/index.qmd
        text: "Delta-gain funnel"
      - href: y1000_deposition/index.qmd
        text: "Y1000+ deposition"
      - href: upo_clades/index.qmd
        text: "UPO clades"
      - href: mucor_secretome.qmd
        text: "Mucor effectors"

# Each report page's title would otherwise render twice: once from the .qmd
# front matter and again as the included REPORT.md's opening H1. See the
# filter's own header comment for why it is fixed here and not in either file.
filters:
  - _filters/drop-duplicate-title.lua

format:
  html:
    theme: cosmo
    toc: true
